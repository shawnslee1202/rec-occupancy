name: Refresh hours and analysis
on:
  push:
    paths: [rec_occupancy/reporting/build_dashboard.py, .github/workflows/analyze.yml]
  workflow_dispatch:
  schedule:
    - cron: '43 4,10,16,22 * * *'
permissions:
  contents: write
concurrency:
  group: occupancy-writer
  cancel-in-progress: false
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m rec_occupancy.collection.import_seeds
      - run: python -m rec_occupancy.collection.refresh_hours
      - name: Archive weather forecast vintage
        run: python -m rec_occupancy.collection.weather
      - run: python -m rec_occupancy.analysis.analyze
      - run: python -m rec_occupancy.reporting.build_dashboard
      - run: python -m rec_occupancy.reporting.build_report
      - name: Refresh daily README summary
        shell: python
        run: |
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          central = ZoneInfo("America/Chicago")
          today = datetime.now(central).strftime("%B %d, %Y")
          readme = Path("README.md")
          original = readme.read_text(encoding="utf-8")
          heading = "## Daily collection summary\n\n"
          before, section = original.split(heading, 1)
          previous, following = section.split("\n## ", 1)
          if not previous.startswith(f"Updated {today}."):
              status = json.loads(Path("reports/status.json").read_text())
              latest = datetime.fromisoformat(status["last_poll"]).astimezone(central)
              summary = (
                  f"Updated {today}. The latest collection in the analysis was "
                  f"{latest:%b %d at %I:%M %p %Z}. The archive contains "
                  f"{status['successful_polls']:,} successful collections and "
                  f"{status['distinct_observations']:,} distinct readings across "
                  f"{status['zones']:,} zones.\n"
              )
              readme.write_bytes(
                  (before + heading + summary + "\n## " + following)
                  .replace("\n", "\r\n" if b"\r\n" in readme.read_bytes() else "\n")
                  .encode("utf-8")
              )
      - uses: actions/upload-artifact@v4
        with:
          name: occupancy-reports
          path: reports/
          retention-days: 30
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md sources config reports dashboard raw rec_counts.sqlite
          if ! git diff --cached --quiet; then
            git commit -m 'analysis: refresh published hours and reports'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dashboard
  deploy:
    needs: analyze
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  cleanup:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      deployments: write
    steps:
      - name: Keep only the current Pages deployment
        uses: actions/github-script@v8
        with:
          script: |
            const repo = context.repo;
            const deployments = await github.paginate(github.rest.repos.listDeployments, {
              ...repo, environment: 'github-pages', per_page: 100
            });
            deployments.sort((a, b) => b.id - a.id);
            const current = deployments[0];
            if (!current || current.sha !== context.sha) {
              throw new Error('The newest Pages deployment does not match this run.');
            }
            const states = await Promise.all(deployments.map(async deployment => {
              const {data} = await github.rest.repos.listDeploymentStatuses({
                ...repo, deployment_id: deployment.id, per_page: 1
              });
              return data[0]?.state;
            }));
            if (states[0] !== 'success' ||
                states.some(state => !['success', 'inactive', 'failure', 'error'].includes(state))) {
              throw new Error('Cleanup requires a successful current deployment and completed older deployments.');
            }
            for (const deployment of deployments.slice(1)) {
              await github.rest.repos.createDeploymentStatus({
                ...repo, deployment_id: deployment.id, state: 'inactive', auto_inactive: false
              });
              await github.rest.repos.deleteDeployment({...repo, deployment_id: deployment.id});
            }
            const remaining = await github.paginate(github.rest.repos.listDeployments, {
              ...repo, environment: 'github-pages', per_page: 100
            });
            if (remaining.length !== 1 || remaining[0].id !== current.id) {
              throw new Error('Deployment cleanup did not leave exactly the current deployment.');
            }
            core.info('Retained deployment ' + current.id + '; removed ' + (deployments.length - 1) + ' older records.');
