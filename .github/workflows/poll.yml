name: Collect occupancy
on:
  workflow_dispatch:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
permissions:
  contents: write
concurrency:
  group: occupancy-writer
  cancel-in-progress: false
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'tzdata>=2025.2,<2028'
      - run: python import_seeds.py
      - name: Capture public feed
        run: python poll_rec_counts.py
      - name: Preserve archive and database, including failure logs
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add raw rec_counts.sqlite
          if ! git diff --cached --quiet; then
            git commit -m 'data: archive facility count poll'
            git push
          fi
      - name: Backup if repository push fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: occupancy-recovery-${{ github.run_id }}
          path: |
            raw/
            rec_counts.sqlite
          retention-days: 30
